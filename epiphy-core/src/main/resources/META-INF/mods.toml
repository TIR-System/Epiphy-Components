[[mods]]
modId = "epiphy"
version = "${file.jarVersion}"
displayName = "Epiphy Core (Epiphy 核心组件底座)"
displayURL = "https://github.com/TIR-System/Epiphy-Components"
authors = "Epiphy-iLLUMs, Gemini 4 Series, Claude 5.5 Series"
credits = "Mascot: DeepSeek"
description = '''
Epiphy 表现层与基础设施核心模组（Minecraft 1.20.1 · Forge · Kotlin for Forge）。

功能概览：
• 声明式 2D 平面合成与富文本渲染：支持屏幕、容器分层、物品槽位与世界三维平面载体，提供离屏 FBO 静态面板缓存、界面级 GUI 纹理重映射，以及字形捕获与按字体纹理图集分桶的逐字合批渲染。
• 3D 物品与空间特效管线：基于原版 ShaderInstance、单物品隔离缓冲刷新与预烘焙网格实现物品材质覆层、环绕几何图层与世界空间三维图元绘制。
• 空间音频与外置数据底座：基于编译期 Mixin Accessor 访问客户端声源与声道控制、支持原版背景音乐暂停避让、区块段调色板方块预筛，以及带备份恢复、损坏拒写锁与跨路径分叉检测的外置 epiphy-data/ 存储管理。

提示：点击左侧【配置 (Config)】按钮可在游戏内调整 2D/3D 渲染选项、帧预算与音频开关。
'''

